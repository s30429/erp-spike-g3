services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }   # a deliberately small instance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://erp:erp@db:5432/erp
      POOL_MAX: "10"
      # SPIKE A: route the whale (tenant 1) to its own database
      TENANT_DSN_MAP: '{"1": "postgresql://erp:erp@db_whale:5432/erp"}'
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      db_whale: { condition: service_healthy }

  # SPIKE A: dedicated database for the whale
  db_whale:
    image: postgres:16
    environment: { POSTGRES_USER: erp, POSTGRES_PASSWORD: erp, POSTGRES_DB: erp }
    ports: ["5433:5432"]
    volumes: ["./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"]
    deploy: { resources: { limits: { cpus: "2", memory: 1g } } }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 3s
      retries: 20